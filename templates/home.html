{% extends "base.html" %}
{% block content %}
<div id="home-body" class="text-center" style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <a id="smarter-button" href="{{ url_for('article') }}" class="btn btn-light btn-lg mb-3">
        Wikimini
    </a>
    <p class="font-weight-normal">Provides a summary of a randomized Wikipedia article.</p>
</div>

<!-- Fixed bottom-right text -->
<p style="position: fixed; bottom: 10px; right: 10px; font-size: 0.9rem; color: #555; text-align: right;">
    Powered by Wikipedia & Gemini 2.5<br>Developed by David Öhman
</p>
<script>
document.getElementById("smarter-button").addEventListener("click", function(event) {
  // Disable button
  this.classList.add("disabled");
  this.style.pointerEvents = "none";

  // Make gradient background faster
  const homeBody = document.getElementById("home-body");
  homeBody.style.animationDuration = "2s";
});
</script>
{% endblock %}
